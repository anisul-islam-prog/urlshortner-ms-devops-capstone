{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "urlshortener.fullname" . }}
  namespace: {{ .Values.global.namespace }}
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    # REMOVED: rewrite-target annotation was breaking all paths
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: urlshortener.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "urlshortener.fullname" . }}-python
                port:
                  number: 5000
          - path: /create
            pathType: Prefix
            backend:
              service:
                name: {{ include "urlshortener.fullname" . }}-python
                port:
                  number: 5000
          - path: /api/stats
            pathType: Prefix
            backend:
              service:
                name: {{ include "urlshortener.fullname" . }}-python
                port:
                  number: 5000
          - path: /api/shorten
            pathType: Prefix
            backend:
              service:
                name: {{ include "urlshortener.fullname" . }}-go
                port:
                  number: 8000
          - path: /r
            pathType: Prefix
            backend:
              service:
                name: {{ include "urlshortener.fullname" . }}-go
                port:
                  number: 8000
          - path: /api/metadata
            pathType: Prefix
            backend:
              service:
                name: {{ include "urlshortener.fullname" . }}-nodejs
                port:
                  number: 3000
{{- end }}