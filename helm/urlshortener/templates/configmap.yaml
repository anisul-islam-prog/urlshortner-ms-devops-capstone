apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "urlshortener.fullname" . }}-config
  namespace: {{ .Values.global.namespace }}
data:
  REDIS_HOST: "{{ include "urlshortener.fullname" . }}-redis"
  REDIS_PORT: "6379"
  GIN_MODE: "release"
  NODE_ENV: "production"
  PYTHONUNBUFFERED: "1"
  BASE_URL: "http://urlshortener.local/r"