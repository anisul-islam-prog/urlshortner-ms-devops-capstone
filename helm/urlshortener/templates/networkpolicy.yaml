apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: urlshortener
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-python
  namespace: urlshortener
spec:
  podSelector:
    matchLabels:
      app: urlshortener-python
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 5000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-python-to-services
  namespace: urlshortener
spec:
  podSelector:
    matchLabels:
      app: urlshortener-python
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: urlshortener-go
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - podSelector:
            matchLabels:
              app: urlshortener-nodejs
      ports:
        - protocol: TCP
          port: 3000
    - to:
        - podSelector:
            matchLabels:
              app: urlshortener-redis
      ports:
        - protocol: TCP
          port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-go-to-redis
  namespace: urlshortener
spec:
  podSelector:
    matchLabels:
      app: urlshortener-go
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: urlshortener-redis
      ports:
        - protocol: TCP
          port: 6379