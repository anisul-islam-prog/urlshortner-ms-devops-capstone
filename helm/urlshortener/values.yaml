global:
  namespace: urlshortener
  imagePullPolicy: Never   # ← Critical: uses locally-built images
  imagePullSecrets: []

redis:
  enabled: true
  image: redis:7-alpine
  replicas: 1
  service:
    type: ClusterIP
    port: 6379
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"

goService:
  image:
    repository: urlshortener-go      # ← No DockerHub prefix
    tag: latest
  replicas: 1
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "200m"
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 50
    targetMemoryUtilizationPercentage: 80

pythonService:
  image:
    repository: urlshortener-python   # ← No DockerHub prefix
    tag: latest
  replicas: 1
  service:
    type: ClusterIP
    port: 5000
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "300m"
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 60

nodeService:
  image:
    repository: urlshortener-nodejs   # ← No DockerHub prefix
    tag: latest
  replicas: 1
  service:
    type: ClusterIP
    port: 3000
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 50

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  hosts:
    - host: urlshortener.local
      paths:
        - path: /
          pathType: Prefix
          service: python-service
          port: 5000
        - path: /api/shorten
          pathType: Prefix
          service: go-service
          port: 8000
        - path: /r
          pathType: Prefix
          service: go-service
          port: 8000
        - path: /api/metadata
          pathType: Prefix
          service: nodejs-service
          port: 3000